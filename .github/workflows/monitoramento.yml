name: Monitoramento PDF

on:
  schedule:
    - cron: '0 * * * *'  # Corrigido: faltava os dois últimos asteriscos
  workflow_dispatch:

permissions:
  contents: write  # Esta linha é essencial para permitir push
  actions: read

jobs:
  executar:
    runs-on: ubuntu-latest
    env:
      EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
      EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
    steps:
      - name: Clonar repositório principal
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # Adicionado para garantir acesso
          fetch-depth: 0  # Importante para acessar outros branches
      
      - name: Clonar branch estado (se existir)
        run: |
          mkdir -p dados_monitoramento
          # Tenta fazer fetch do branch estado
          if git fetch origin estado:estado 2>/dev/null; then
            echo "Branch 'estado' encontrado, restaurando arquivos..."
            # Verifica se os arquivos existem no branch estado
            if git show estado:estado_monitor.json > dados_monitoramento/estado_monitor.json 2>/dev/null; then
              echo "Estado anterior restaurado"
            else
              echo "Arquivo estado_monitor.json não encontrado no branch estado"
            fi
            if git show estado:log_monitor.log > dados_monitoramento/log_monitor.log 2>/dev/null; then
              echo "Log anterior restaurado"
            else
              echo "Arquivo log_monitor.log não encontrado no branch estado"
            fi
          else
            echo "Branch 'estado' ainda não existe - primeira execução"
          fi
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
      
      - name: Executar script
        run: |
          python monitoramento_medicamentos.py
      
      - name: Comitar novo estado no branch 'estado'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B estado
          git add dados_monitoramento/estado_monitor.json dados_monitoramento/log_monitor.log
          git commit -m "Atualiza estado e log [skip ci]" || echo "Nada novo para comitar"
          git push origin estado --force
