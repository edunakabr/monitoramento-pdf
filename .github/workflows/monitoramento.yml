name: Monitoramento PDF

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest

    env:
      EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
      EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Baixar estado anterior (se existir)
        uses: actions/download-artifact@v4
        with:
          name: dados-monitoramento
          path: dados_monitoramento
        continue-on-error: true  # Isso impede falha se for a primeira execução

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Executar monitoramento
        run: |
          python monitoramento_medicamentos.py

      - name: Salvar estado e log atual
        uses: actions/upload-artifact@v4
        with:
          name: dados-monitoramento
          path: dados_monitoramento
