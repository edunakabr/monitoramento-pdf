name: Monitoramento PDF

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest

    env:
      EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
      EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}

    steps:
      - name: Clonar repositório principal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Importante para acessar outros branches

      - name: Clonar branch estado (se existir)
        run: |
          git fetch origin estado:estado || echo "Branch 'estado' ainda não existe"
          mkdir -p dados_monitoramento
          git show estado:estado_monitor.json > dados_monitoramento/estado_monitor.json || echo "Sem estado anterior"
          git show estado:log_monitor.log > dados_monitoramento/log_monitor.log || echo "Sem log anterior"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Executar script
        run: |
          python monitoramento_medicamentos.py

      - name: Comitar novo estado no branch 'estado'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B estado
          git add dados_monitoramento/estado_monitor.json dados_monitoramento/log_monitor.log
          git commit -m "Atualiza estado e log [skip ci]" || echo "Nada novo para comitar"
          git push origin estado --force
